# ~/.config/atuin/config.toml
#
# LOCAL ONLY. auto_sync is off and no sync_address is configured, so history
# never leaves this machine. Flip auto_sync + run `atuin register` if you later
# want encrypted cross-machine sync.

auto_sync = false
update_check = false

style = "compact"
inline_height = 20
show_preview = true
show_help = false
enter_accept = true # Enter runs it; Tab edits it first

# Start scoped to the current directory — usually what you want — then cycle
# to global/session with Ctrl-R inside the picker.
filter_mode = "global"
filter_mode_shell_up_key_binding = "directory"
search_mode = "fuzzy"

# Do not record these, ever.
history_filter = [
  "^\\s",                                  # any command typed with a leading space
  "^curl .*(token|key|secret|password)",
  "^export .*(TOKEN|KEY|SECRET|PASSWORD)",
  "^.*API_KEY=",
]

[stats]
common_prefix = ["sudo", "time", "env"]
