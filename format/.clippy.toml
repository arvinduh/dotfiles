# Global Clippy configuration for crates under $HOME lacking their own.
# Clippy recursively searches parent directories up to the filesystem root.

# Complexity thresholds
cognitive-complexity-threshold = 25

# Standard identifier exceptions for doc markdown linting
doc-valid-idents = [
  "JavaScript",
  "WebAssembly",
  "Wasm",
  "HTML",
  "CSS",
  "DOM",
  "DPR",
  "JSON",
  "API",
  "URL",
]

# Google Rust guide: `expect` over `unwrap`, except in tests.
allow-unwrap-in-tests = true

# Google Rust guide: never call `catch_unwind` in first-party code.
disallowed-methods = [
  { path = "std::panic::catch_unwind", reason = "Google Rust guide: panics abort; do not catch them" },
]
