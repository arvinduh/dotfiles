# Ruff's genuine user-level config slot: ~/.config/ruff/ruff.toml on Linux,
# %APPDATA%\ruff\ruff.toml on Windows. Used only when a project has no
# pyproject.toml / ruff.toml of its own.

line-length = 80

# NOTE: 2 spaces is what you asked for globally, but be aware that Google's
# Python style guide says 4 (matching PEP 8) even though its C++/TS/Java guides
# say 2. Flip this to 4 if the divergence from every library you read starts to
# grate — it is a one-character change.
indent-width = 2

target-version = "py312"

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort — import sorting
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
  "D",   # pydocstyle — Google docstrings on every public item
  "ANN", # flake8-annotations — complete signatures
  "N",   # pep8-naming
  "TID", # flake8-tidy-imports — bans below
  # Google Python Style Guide rules a linter can check:
  "ARG",     # unused arguments (Google: `del` them, never rename)
  "BLE001",  # no catch-all `except Exception`
  "EXE",     # shebang only on executable files
  "FURB129", # iterate files directly, not `.readlines()`
  "G",       # logging takes %-patterns, never f-strings
  "ICN001",  # conventional aliases only (np, pd)
  "PLC0415", # imports at the top of the file
  "PLW0603", # no `global` mutation
  "RET505", "RET506", "RET507", "RET508", # no else after an exit
  "S101",    # no assert outside tests
  "T20",     # no print in libraries
  "TD",      # TODO: <link> - <text>
  "TRY002",  # raise specific exceptions
]
ignore = [
  "E501", # line-too-long — the formatter owns width, the linter shouldn't nag
  "TD002", # Google TODOs name a link, not an author
]

[lint.per-file-ignores]
# Google: test docstrings are optional.
"*_test.py" = ["D", "S101"]
"test_*.py" = ["D", "S101"]
"conftest.py" = ["D", "S101"]
# Entrypoints own console output.
"{**/main.py,**/__main__.py,**/cli/**,scripts/**}" = ["T20"]

[lint.pydocstyle]
convention = "google"

# Google import order: one import per line, sorted by full module path with
# `import x` and `from x import y` interleaved.
[lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["typing", "collections.abc"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Deliberate deviation from Google: no postponed annotations.
[lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Quote forward references instead."

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true      # format code inside docstrings too
docstring-code-line-length = 72
