# Applied by `ahok setup ~/.dotfiles` (see arvinduh/ahok).
#
# Each [[link]] symlinks `from` (inside this repo) to `to`. A trailing `/*`
# links each child into the target directory instead. `to` is one path, or
# one per OS as { linux, windows }; cloud sessions use the linux target.
# `on` limits the platforms (linux, windows, cloud); default: all three.

# --- editor: VS Code and Antigravity share one settings file ------------------

[[link]]
from = "vscode/settings.json"
to = { linux = "~/.config/Code/User/settings.json", windows = "%APPDATA%/Code/User/settings.json" }
on = ["linux", "windows"]

[[link]]
from = "vscode/settings.json"
to = { linux = "~/.config/Antigravity/User/settings.json", windows = "%APPDATA%/Antigravity/User/settings.json" }
on = ["linux", "windows"]

# --- formatter configs --------------------------------------------------------

[[link]]
from = "format/.editorconfig"
to = "~/.editorconfig"
on = ["linux", "windows"]

[[link]]
from = "format/.clang-format"
to = "~/.clang-format"
on = ["linux", "windows"]

[[link]]
from = "format/.clang-tidy"
to = "~/.clang-tidy"
on = ["linux", "windows"]

[[link]]
from = "format/.prettierrc"
to = "~/.prettierrc"
on = ["linux", "windows"]

[[link]]
from = "format/.taplo.toml"
to = "~/.taplo.toml"
on = ["linux", "windows"]

[[link]]
from = "format/.clippy.toml"
to = "~/.clippy.toml"
on = ["linux", "windows"]

[[link]]
from = "format/.shellcheckrc"
to = "~/.shellcheckrc"
on = ["linux", "windows"]

[[link]]
from = "format/rustfmt.toml"
to = { linux = "~/.config/rustfmt/rustfmt.toml", windows = "%APPDATA%/rustfmt/rustfmt.toml" }

[[link]]
from = "format/ruff.toml"
