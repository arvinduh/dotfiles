# --- dev toolchains: mise owns every portable runtime and CLI -----------------

[[link]]
from = "mise/config.toml"
to = "~/.config/mise/config.toml"
on = ["linux", "windows"]

[[link]]
from = "windows/checkstyle.cmd"
to = "~/.local/bin/checkstyle.cmd"
on = ["windows"]

# --- shell and git ------------------------------------------------------------

[[link]]
from = "zsh/.zshenv"
to = "~/.zshenv"
on = ["linux"]

[[link]]
from = "zsh"
to = "~/.config/zsh"
on = ["linux"]

[[link]]
from = "git"
to = "~/.config/git"
on = ["linux", "windows"]

[[link]]
from = "atuin"
to = "~/.config/atuin"
on = ["linux"]

[[link]]
from = "bat"
to = "~/.config/bat"
on = ["linux"]

[[link]]
from = "bat/config"
to = "%APPDATA%/bat/config"
on = ["windows"]

[[link]]
from = "windows/starship.toml"
to = "~/.config/starship.toml"
on = ["windows"]

[[link]]
from = "windows/profile.ps1"
to = "%DOCUMENTS%/PowerShell/Microsoft.PowerShell_profile.ps1"
on = ["windows"]

[[link]]
from = "windows/terminal.json"
to = "%LOCALAPPDATA%/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json"
on = ["windows"]

# --- OpenTabletDriver: tablet mapping + the custom Wacom CTH-460 definition ---

[[link]]
from = "windows/opentabletdriver/settings.json"
to = "%LOCALAPPDATA%/OpenTabletDriver/settings.json"
on = ["windows"]

[[link]]
from = "windows/opentabletdriver/CTH-460.json"
to = "%LOCALAPPDATA%/OpenTabletDriver/Configurations/CTH-460.json"
on = ["windows"]
