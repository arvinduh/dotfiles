# ~/.config/tmux/tmux.conf
# No plugin manager. Everything here is core tmux, so this file works on any
# box with tmux 3.2+ and needs no bootstrap step.

# ---- Core -------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,alacritty:Tc,xterm-256color:Tc"
set -g escape-time 10          # 0 breaks some terminals; 10 is imperceptible
set -g focus-events on         # nvim autoread / autocmds need this
set -g history-limit 50000
set -g mouse on
set -g base-index 1            # windows start at 1 — 0 is a long reach
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g display-time 2000
setw -g mode-keys vi
setw -g aggressive-resize on

# ---- Prefix: C-a ------------------------------------------------------------
# C-b collides with readline's backward-char. C-a is the screen convention.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- Reload -----------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "  reloaded"

# ---- Splits: | and - , opening in the current directory ---------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- Pane navigation: vim keys ----------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize, repeatable (hold the key after prefix).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+arrow with no prefix at all.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ---- Windows ----------------------------------------------------------------
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# ---- Copy mode: vim semantics ----------------------------------------------
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# Drag-select with the mouse copies without jumping to the bottom.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# WSL: pipe yanked text into the Windows clipboard too.
if-shell 'grep -qi microsoft /proc/version 2>/dev/null' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"'

# ---- Session picker ---------------------------------------------------------
bind s choose-tree -Zs
bind BSpace switch-client -l

# ---- Status line: catppuccin mocha, hand-rolled -----------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold]  #S #[fg=#cba6f7,bg=#1e1e2e]"

set -g status-right-length 80
set -g status-right "#[fg=#45475a]#[fg=#cdd6f4,bg=#45475a] #{?client_prefix,#[fg=#f38ba8]󰄾 ,}#(whoami)@#h #[fg=#cba6f7,bg=#45475a]#[fg=#1e1e2e,bg=#cba6f7,bold] %H:%M "

setw -g window-status-format "#[fg=#6c7086,bg=#1e1e2e]  #I:#W#{?window_zoomed_flag, ,} "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa]#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W#{?window_zoomed_flag, ,} #[fg=#89b4fa,bg=#1e1e2e]"
setw -g window-status-separator ""

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#cba6f7,fg=#1e1e2e,bold"
set -g mode-style "bg=#585b70,fg=#cdd6f4"
