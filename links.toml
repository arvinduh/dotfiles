# links.toml — Declarative link definitions for link.py.
#
# Schema per entry:
#   source:  path inside this repository. A trailing `/*` links each child into
#            the target directory instead of linking the source itself.
#   home:    target path on both Linux and Windows.
#   linux:   target path override for Linux/WSL.
#   windows: target path override for Windows.
#   cloud:   set to true to also link in Claude Code cloud sessions, at the
#            linux target.

# --- editor: VS Code and Antigravity share one settings file ------------------

[[link]]
source = "vscode/settings.json"
linux = "~/.config/Code/User/settings.json"
windows = "%APPDATA%/Code/User/settings.json"

[[link]]
source = "vscode/settings.json"
linux = "~/.config/Antigravity/User/settings.json"
windows = "%APPDATA%/Antigravity/User/settings.json"

# --- formatter configs --------------------------------------------------------

[[link]]
source = "format/.editorconfig"
home = "~/.editorconfig"

[[link]]
source = "format/.clang-format"
home = "~/.clang-format"

[[link]]
source = "format/.clang-tidy"
home = "~/.clang-tidy"

[[link]]
source = "format/.prettierrc"
home = "~/.prettierrc"

[[link]]
source = "format/.taplo.toml"
home = "~/.taplo.toml"

[[link]]
source = "format/.clippy.toml"
home = "~/.clippy.toml"

[[link]]
source = "format/.shellcheckrc"
home = "~/.shellcheckrc"

[[link]]
source = "format/rustfmt.toml"
linux = "~/.config/rustfmt/rustfmt.toml"
windows = "%APPDATA%/rustfmt/rustfmt.toml"
cloud = true

[[link]]
source = "format/ruff.toml"
linux = "~/.config/ruff/ruff.toml"
windows = "%APPDATA%/ruff/ruff.toml"
cloud = true

[[link]]
source = "format/.markdownlint-cli2.jsonc"
home = "~/.config/markdownlint/.markdownlint-cli2.jsonc"

# --- dev toolchains: mise owns every portable runtime and CLI -----------------

[[link]]
source = "mise/config.toml"
home = "~/.config/mise/config.toml"

[[link]]
source = "windows/checkstyle.cmd"
windows = "~/.local/bin/checkstyle.cmd"

# --- shell and git ------------------------------------------------------------

[[link]]
source = "zsh/.zshenv"
linux = "~/.zshenv"

[[link]]
source = "zsh"
linux = "~/.config/zsh"

[[link]]
source = "git"
home = "~/.config/git"

[[link]]
source = "atuin"
linux = "~/.config/atuin"

[[link]]
source = "bat"
linux = "~/.config/bat"

[[link]]
source = "bat/config"
windows = "%APPDATA%/bat/config"

[[link]]
source = "windows/starship.toml"
windows = "~/.config/starship.toml"

[[link]]
source = "windows/profile.ps1"
windows = "%DOCUMENTS%/PowerShell/Microsoft.PowerShell_profile.ps1"

[[link]]
source = "windows/terminal.json"
windows = "%LOCALAPPDATA%/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json"

# --- OpenTabletDriver: tablet mapping + the custom Wacom CTH-460 definition ---

[[link]]
source = "windows/opentabletdriver/settings.json"
windows = "%LOCALAPPDATA%/OpenTabletDriver/settings.json"

[[link]]
source = "windows/opentabletdriver/CTH-460.json"
windows = "%LOCALAPPDATA%/OpenTabletDriver/Configurations/CTH-460.json"
