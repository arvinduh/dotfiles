# links.toml — Declarative link definitions for link.py.
#
# Schema per entry:
#   source:  path inside this repository. A trailing `/*` links each child into
#            the target directory instead of linking the source itself.
#   home:    target path on both Linux and Windows.
#   linux:   target path override for Linux/WSL.
#   windows: target path override for Windows.
#   cloud:   set to true to also link in Claude Code cloud sessions, at the
#            linux target.

# --- agents: one copy of directives and skills, linked into each tool ---------

[[link]]
source = "agents"
home = "~/.agents"
cloud = true

[[link]]
source = "claude/CLAUDE.md"
home = "~/.claude/CLAUDE.md"
cloud = true

[[link]]
source = "claude/settings.json"
home = "~/.claude/settings.json"
cloud = true

[[link]]
source = "agents/skills/*"
home = "~/.claude/skills"
cloud = true

[[link]]
source = "agents/AGENTS.md"
home = "~/.gemini/config/AGENTS.md"

[[link]]
source = "agents/skills"
home = "~/.gemini/config/skills"

[[link]]
source = "gemini/hooks.json"
home = "~/.gemini/config/hooks.json"

# --- editor: VS Code and Antigravity share one settings file ------------------

[[link]]
source = "vscode/settings.json"
linux = "~/.config/Code/User/settings.json"
windows = "%APPDATA%/Code/User/settings.json"

[[link]]
source = "vscode/settings.json"
linux = "~/.config/Antigravity/User/settings.json"
windows = "%APPDATA%/Antigravity/User/settings.json"

# --- formatting and quality hooks ---------------------------------------------

[[link]]
source = "format/format-file.py"
linux = "~/.local/bin/format-file"
cloud = true

[[link]]
source = "format/format-file.py"
windows = "~/.local/bin/format-file.py"

[[link]]
source = "format/format-file.cmd"
windows = "~/.local/bin/format-file.cmd"

[[link]]
source = "format/stop-gate.py"
linux = "~/.local/bin/stop-gate"
cloud = true

[[link]]
source = "format/stop-gate.py"
windows = "~/.local/bin/stop-gate.py"

[[link]]
source = "format/stop-gate.cmd"
windows = "~/.local/bin/stop-gate.cmd"

